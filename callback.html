<!DOCTYPE html>
<html>
<head><title>TikTok Login Callback</title></head>
<body style="font-family:sans-serif;max-width:700px;margin:40px auto;padding:20px">
  <h1>Login successful</h1>
  <p>Copy the <code>code</code> from this URL and paste it into the terminal:</p>
  <p id="code" style="background:#f0f0f0;padding:15px;word-break:break-all;font-family:monospace"></p>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    document.getElementById('code').textContent = code || 'No code found in URL';
  </script>
</body>
</html>
