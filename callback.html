<!DOCTYPE html>
<html>
<head>
  <title>TikTok Login</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; }
    h1 { color: #222; }
    code { background: #f4f4f4; padding: 3px 6px; border-radius: 4px; }
    #code {
      background: #1a1a1a;
      color: #00ff88;
      padding: 20px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      word-break: break-all;
      user-select: all;
    }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h1>TikTok Login</h1>
  <p id="msg">Copy the code below and paste it into the terminal:</p>
  <div id="code">Loading...</div>
  <script>
    const p = new URLSearchParams(window.location.search);
    const code = p.get('code');
    const err = p.get('error');
    const el = document.getElementById('code');
    if (err) {
      document.getElementById('msg').innerHTML = '<span class="error">Error: ' + err + '</span>';
      el.textContent = p.get('error_description') || 'See terminal for details';
    } else if (code) {
      el.textContent = code;
    } else {
      el.textContent = 'No code found in URL';
    }
  </script>
</body>
</html>
